name: CI

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: lint-3.13-${{ hashFiles('uv.lock') }}

      - name: Sync lint and docs dependencies
        run: uv sync --group=lint --group=docs --group=test --frozen

      - name: Run lint checks
        run: make lint

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: test-${{ matrix.python-version }}-highest-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync test dependencies
        run: uv sync --group=test --frozen

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}
        run: make test-cov

      - name: Upload coverage data artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test-lowest-direct:
    name: Test (Python 3.11, lowest-direct)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testing
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.11"
          enable-cache: true
          cache-suffix: test-3.11-lowest-direct-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Run tests with lowest direct dependency bounds
        run: make test-cov-lowest-direct

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  coverage-summary:
    name: Coverage Summary
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: coverage-summary-3.14-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync test dependencies
        run: uv sync --group=test --frozen

      - name: Download coverage data artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-py*
          merge-multiple: true
          path: coverage-artifacts

      - name: Combine and report coverage
        run: |
          uv run coverage combine --keep coverage-artifacts
          uv run coverage report --show-missing --skip-covered | tee coverage-report.txt
          uv run coverage xml -o coverage.xml
          {
            echo "total_pct=$(uv run coverage report --format=total)"
          } >> "$GITHUB_ENV"

      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage Summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Combined branch coverage | ${total_pct}% |"
            echo
            echo "<details><summary>Full report</summary>"
            echo
            echo '```text'
            cat coverage-report.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: |
            coverage.xml
            coverage-report.txt
          if-no-files-found: error
          retention-days: 2

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  security:
    name: Security
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: security-3.13-${{ hashFiles('uv.lock') }}

      - name: Sync security dependencies
        run: uv sync --group=security --frozen

      - name: Run uv audit
        id: audit
        continue-on-error: true
        run: make audit

      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: make bandit

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Run Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          skip-dirs: .git,.github,.venv,docs/_build
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Run Zizmor
        id: zizmor
        if: always()
        continue-on-error: true
        run: make zizmor

      - name: Upload Zizmor SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Publish security summary
        if: always()
        run: |
          icon() { [ "$1" = "success" ] && echo "✓" || echo "✗"; }
          {
            echo "## Security Scan Summary"
            echo
            echo "| Scanner | Result |"
            echo "|---|---|"
            echo "| Dependency Audit (uv audit) | $(icon "${{ steps.audit.outcome }}") ${{ steps.audit.outcome }} |"
            echo "| Bandit (SAST) | $(icon "${{ steps.bandit.outcome }}") ${{ steps.bandit.outcome }} |"
            echo "| Trivy (filesystem scan) | $(icon "${{ steps.trivy.outcome }}") ${{ steps.trivy.outcome }} |"
            echo "| Zizmor (workflow lint) | $(icon "${{ steps.zizmor.outcome }}") ${{ steps.zizmor.outcome }} |"
            echo
            echo "See the Security tab for detailed findings from each scanner."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

      - name: Security gate
        if: always()
        run: |
          failed=0
          declare -A results=(
            ["uv audit"]="${{ steps.audit.outcome }}"
            ["Bandit"]="${{ steps.bandit.outcome }}"
            ["Trivy"]="${{ steps.trivy.outcome }}"
            ["Zizmor"]="${{ steps.zizmor.outcome }}"
          )
          for name in "${!results[@]}"; do
            outcome="${results[$name]}"
            if [ "$outcome" != "success" ]; then
              echo "::error title=${name} failed::${name} reported an outcome of '${outcome}'. See the '${name}' step above for details."
              failed=1
            fi
          done
          exit "$failed"

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
