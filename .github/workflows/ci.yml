name: CI

env:
  UV_FROZEN: "1"

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  python-policy:
    name: Python Version Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      lint-python: ${{ steps.policy.outputs.lint-python }}
      lowest-direct-python: ${{ steps.policy.outputs.lowest-direct-python }}
      cross-platform-python: ${{ steps.policy.outputs.cross-platform-python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Python version policy
        id: policy
        run: |
          python3 scripts/python_versions.py --validate
          echo "matrix=$(python3 scripts/python_versions.py --github-matrix)" >> "$GITHUB_OUTPUT"
          echo "lint-python=$(python3 scripts/python_versions.py --lint-python)" >> "$GITHUB_OUTPUT"
          echo "lowest-direct-python=$(python3 scripts/python_versions.py --lowest-direct-python)" >> "$GITHUB_OUTPUT"
          echo "cross-platform-python=$(python3 scripts/python_versions.py --cross-platform-python)" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: python-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ needs.python-policy.outputs.lint-python }}
          cache-suffix: lint-${{ needs.python-policy.outputs.lint-python }}-${{ hashFiles('uv.lock') }}

      - name: Sync lint and docs dependencies
        run: uv sync --group=lint --group=docs --frozen

      - name: Run lint checks
        run: make lint

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [lint, python-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-policy.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: test-${{ matrix.python-version }}-highest-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync test dependencies
        run: uv sync --group=test --frozen

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: .coverage.${{ matrix.python-version }}
        run: make test-cov

      - name: Upload coverage data artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-py${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload JUnit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: error
          retention-days: 90

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test-lowest-direct:
    name: Test (Python ${{ needs.python-policy.outputs.lowest-direct-python }}, lowest-direct)
    needs: [lint, python-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ needs.python-policy.outputs.lowest-direct-python }}
          cache-suffix: test-${{ needs.python-policy.outputs.lowest-direct-python }}-lowest-direct-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Run tests with lowest direct dependency bounds
        run: make test-cov-lowest-direct

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  package-smoke:
    name: Package Smoke Test
    needs: [lint, python-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ needs.python-policy.outputs.lint-python }}
          cache-suffix: package-smoke-${{ needs.python-policy.outputs.lint-python }}-${{ hashFiles('uv.lock') }}

      - name: Build distributions
        run: uv build

      - name: Sync build dependencies
        run: uv sync --group=build --no-default-groups --frozen

      - name: Validate distribution metadata
        run: uv run --no-sync --group=build twine check dist/*

      - name: Smoke test built wheel
        run: |
          uv venv .venv-wheel-smoke
          uv pip install --python .venv-wheel-smoke/bin/python dist/*.whl
          .venv-wheel-smoke/bin/python - <<'PY'
          from cb_events import Event, EventType

          event = Event.model_validate({
              "method": "tip",
              "id": "smoke",
              "object": {"tip": {"tokens": 1}},
          })
          assert event.type is EventType.TIP
          assert event.tip is not None
          assert event.tip.tokens == 1
          PY

      - name: Smoke test source distribution
        run: |
          uv venv .venv-sdist-smoke
          uv pip install --python .venv-sdist-smoke/bin/python dist/*.tar.gz
          .venv-sdist-smoke/bin/python - <<'PY'
          from cb_events import EventType

          assert EventType.TIP.value == "tip"
          PY

      - name: Run example against current source
        run: uv run --with . examples/event_handling.py --help

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  coverage-summary:
    name: Coverage Summary
    if: ${{ success() }}
    needs: [test, python-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ needs.python-policy.outputs.lint-python }}
          cache-suffix: coverage-summary-${{ needs.python-policy.outputs.lint-python }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync test dependencies
        run: uv sync --group=test --frozen

      - name: Download coverage data artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-py*
          merge-multiple: true
          path: coverage-artifacts
          if-no-files-found: warn

      - name: Combine and report coverage
        run: |
          uv run coverage combine --keep coverage-artifacts
          uv run coverage report --show-missing --skip-covered | tee coverage-report.txt
          uv run coverage xml -o coverage.xml
          {
            echo "total_pct=$(uv run coverage report --format=total)"
          } >> "$GITHUB_ENV"

      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage Summary"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Combined branch coverage | ${total_pct}% |"
            echo
            echo "<details><summary>Full report</summary>"
            echo
            echo '```text'
            cat coverage-report.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-combined
          path: |
            coverage.xml
            coverage-report.txt
          if-no-files-found: error
          retention-days: 90

      - name: Download JUnit artifacts
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-py*
          path: junit-artifacts

      - name: Upload combined JUnit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-junit
          path: junit-artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test-cross-platform:
    name: Test (${{ matrix.os }}, Python ${{ needs.python-policy.outputs.cross-platform-python }})
    needs: [lint, python-policy]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ needs.python-policy.outputs.cross-platform-python }}
          cache-suffix: test-${{ matrix.os }}-${{ needs.python-policy.outputs.cross-platform-python }}-${{ hashFiles('uv.lock') }}

      - name: Sync test dependencies
        run: uv sync --group=test --frozen

      - name: Run tests
        run: uv run --no-sync pytest -m "not live"

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  security:
    name: Security
    needs: [lint, python-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          python-version: ${{ needs.python-policy.outputs.lint-python }}
          cache-suffix: security-${{ needs.python-policy.outputs.lint-python }}-${{ hashFiles('uv.lock') }}

      - name: Sync security dependencies
        run: uv sync --group=security --frozen

      - name: Run uv audit
        id: audit
        run: make audit

      - name: Run Trivy
        id: trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          skip-dirs: .git,.github,.venv,docs/_build
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Run Zizmor
        id: zizmor
        if: ${{ !cancelled() }}
        run: make zizmor

      - name: Upload Zizmor SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Publish security summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Security Scan Summary"
            echo
            echo "| Scanner | Result |"
            echo "|---|---|"
            echo "| Dependency Audit (uv audit) | ${{ steps.audit.outcome }} |"
            echo "| Trivy (filesystem scan) | ${{ steps.trivy.outcome }} |"
            echo "| Zizmor (workflow lint) | ${{ steps.zizmor.outcome }} |"
            echo
            echo "See the Security tab for detailed findings from each scanner."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
