name: Setup uv
description: Install the repository's pinned uv and Python versions

inputs:
  python-version:
    description: Python version to install
    required: true
  cache-enabled:
    description: Whether uv dependency caching is enabled
    required: false
    default: "true"
  cache-suffix:
    description: Cache namespace for the workflow job
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.9"
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.cache-enabled }}
        cache-suffix: ${{ inputs.cache-suffix }}
