name: Setup uv
description: Install the repository's pinned uv and Python versions

inputs:
  python-version:
    description: Python version to install
    required: true
  cache-enabled:
    description: Whether uv dependency caching is enabled
    required: false
    default: "true"
  cache-suffix:
    description: Cache namespace for the workflow job
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.9"
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.cache-enabled }}
        cache-suffix: ${{ inputs.cache-suffix }}
